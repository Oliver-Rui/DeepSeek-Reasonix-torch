# A fork-friendly release path: publish the Windows packages of an already
# green release-studio run as a GitHub Release, without the minisign key the
# main workflow's publish gate requires. macOS/Linux and code signing are
# deliberately out of scope — this is only the "get it onto GitHub" path.
name: Publish Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing studio tag to publish (for example studio-v2.66.0)"
        required: true
        type: string
      run_id:
        description: "release-studio run whose studio-build-windows-* artifacts to publish"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-windows-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish Windows-only GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve version and notes
        id: info
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#studio-v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          notes="release-notes/studio/${version}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::no $notes; every release requires user-visible notes"
            exit 1
          fi
          cp "$notes" "$RUNNER_TEMP/release-notes.md"

      - name: Download the Windows build artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          mkdir -p dist
          gh run download "$RUN_ID" \
            -n studio-build-windows-amd64 -D dist/amd64
          gh run download "$RUN_ID" \
            -n studio-build-windows-arm64 -D dist/arm64
          find dist -type f -name 'ReasonixStudio-*' -exec cp -n {} dist/ \;
          ls -la dist
          # Windows-only path: verify just the four packages this workflow ships.
          for arch in amd64 arm64; do
            for name in "ReasonixStudio-windows-$arch-installer.exe" "ReasonixStudio-windows-$arch.zip"; do
              test -s "dist/$name" || { echo "::error::missing or empty $name"; exit 1; }
            done
          done

      - name: Name packages with the version
        env:
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          # Match the historical release names (ReasonixStudio-<version>-<os>-<arch>-<kind>),
          # so the four files read apart at a glance in the assets list.
          for f in dist/ReasonixStudio-windows-*.exe dist/ReasonixStudio-windows-*.zip; do
            base="$(basename "$f")"
            # ReasonixStudio-windows-amd64-installer.exe -> ReasonixStudio-2.66.0-windows-amd64-installer.exe
            mv "$f" "dist/ReasonixStudio-${VERSION}-${base#ReasonixStudio-}"
          done
          ls -la dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ steps.info.outputs.version }}
        run: |
          mapfile -t assets < <(find dist -maxdepth 1 -type f \( -name '*.exe' -o -name '*.zip' \) | sort)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" --title "Reasonix Studio $VERSION"
            # A previous run may have uploaded the unversioned names; drop them
            # so the assets list holds one clearly-named set, not two of each.
            gh release view "$TAG" --json assets --jq '.assets[].name' \
              | grep '^ReasonixStudio-' \
              | while read -r old; do gh release delete-asset "$TAG" "$old" -y; done
            gh release upload "$TAG" "${assets[@]}"
          else
            candidate=false
            case "$VERSION" in *-*) candidate=true ;; esac
            mapfile -t flags < <(git tag -l 'studio-v*' | bash scripts/studio-release-flags.sh "$TAG" "$candidate")
            gh release create "$TAG" "${assets[@]}" \
              --title "Reasonix Studio $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              "${flags[@]}"
          fi
